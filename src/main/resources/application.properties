spring.application.name=Smart College Resource Management System
server.port=${PORT:8080}

# MySQL Database Configuration
# Environment variables with sensible dev fallbacks; database: college_resource_db
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:college_resource_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Schema Management
# Safe development schema strategy: 'update' automatically synchronizes entity changes without destroying data
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Application Secrets / Security Configuration
app.jwt.secret=${JWT_SECRET:smartCollegeSuperSecretSigningKeyForDevelopmentPurposesOnly123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Administrator Setup (One-time secure initialization)
app.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:true}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@college.edu}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:Admin@12345}
app.initial-admin.name=${INITIAL_ADMIN_NAME:System Administrator}
app.initial-admin.department=${INITIAL_ADMIN_DEPARTMENT:Campus Administration}

# Booking Policy Configuration
app.booking.faculty-approval-enabled=${FACULTY_APPROVAL_ENABLED:false}

